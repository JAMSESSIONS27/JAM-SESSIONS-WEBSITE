<section id="contact" aria-labelledby="contact-heading">
  <h2 id="contact-heading">Contact Us</h2>
  <p>Have a question or want to join JAM SESSIONS? Get in touch!</p>

  <!-- Contact options -->
  <p>
    Phone: <a href="tel:9802293425">9802293425</a><br>
    Email: <a href="mailto:kenhill@jamsessions27.org">kenhill@jamsessions27.org</a>
  </p>

  <form id="contact-form" action="https://formspree.io/f/your-form-id" method="POST" novalidate>
    <div>
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" required aria-required="true" />
    </div>

    <div>
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" required aria-required="true" />
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
    </div>

    <!-- Honeypot to reduce spam -->
    <div style="display:none" aria-hidden="true">
      <label for="website">Website</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
    </div>

    <button type="submit">Send message</button>

    <!-- status area for accessibility; will be focused programmatically -->
    <div id="form-status" role="status" aria-live="polite" class="sr-only" tabindex="-1"></div>
  </form>
</section>
